name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify package, lint & build demo (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify package (generated files, fonts, pack contents, types)
        run: npm run verify
      - run: npm run lint
      - name: Build demo (static export)
        run: npm run build

  smoke:
    name: Smoke test Next.js ${{ matrix.next }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next: ['13.5', '14', '15', '16']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build a test app against the packed tarball
        run: node scripts/smoke-test.mjs --next ${{ matrix.next }}
